<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TKS Model UN — Term Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --chamber:#0A2540; --chamber-deep:#061A2E; --chamber-line:#16395C;
    --placard:#F7F5F0; --placard-dim:#DFDCD4;
    --un:#4A9FD8; --gavel:#C8A44D; --gavel-dim:#8A7233;
    --ink:#0A2540; --ink-soft:#4A5C6E; --present:#3E9C74; --warn:#C86A4D;
    --t0:#8A99A8; --t1:#4A9FD8; --t2:#3E9C74; --t3:#C8A44D; --t4:#E8C86A;
    --display:'Oswald',Impact,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--chamber);color:var(--placard);font-family:var(--body);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 72px}

  .adminbar{background:var(--gavel);color:var(--chamber-deep);font-family:var(--mono);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-align:center;
    padding:6px 12px;font-weight:600}
  .draftbar{background:var(--warn);color:#fff;font-family:var(--mono);font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:6px 12px;font-weight:600}

  .chamber-bar{border-bottom:1px solid var(--chamber-line);
    background:linear-gradient(180deg,var(--chamber-deep),var(--chamber));padding:22px 0 18px}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--un);margin:0 0 6px}
  .chamber-bar h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,7vw,42px);
    letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
  .chamber-bar h1 .thin{font-weight:300;color:var(--placard-dim)}
  .session-strip{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;margin-top:12px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--placard-dim)}
  .session-strip b{color:var(--gavel);font-weight:600}

  nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--chamber-line);
    margin-bottom:24px;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;appearance:none;background:none;border:0;border-bottom:2px solid transparent;
    color:var(--placard-dim);font-family:var(--display);font-weight:400;font-size:14px;
    letter-spacing:.12em;text-transform:uppercase;padding:14px 13px 11px;cursor:pointer;
    transition:color .18s,border-color .18s}
  .tab:hover{color:var(--placard)}
  .tab[aria-selected="true"]{color:var(--gavel);border-bottom-color:var(--gavel)}
  .tab:focus-visible{outline:2px solid var(--un);outline-offset:-4px}

  h2.sec{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--un);margin:26px 0 4px}
  h2.sec:first-child{margin-top:0}
  p.sub{color:var(--placard-dim);font-size:13.5px;margin:0 0 18px;max-width:62ch}

  .seg{display:inline-flex;border:1px solid var(--chamber-line);border-radius:2px;
    overflow:hidden;margin:0 10px 16px 0;vertical-align:top}
  .seg button{appearance:none;background:transparent;border:0;color:var(--placard-dim);
    font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    padding:9px 16px;cursor:pointer;transition:background .16s,color .16s}
  .seg button[aria-pressed="true"]{background:var(--gavel);color:var(--chamber-deep);font-weight:500}
  .seg button:focus-visible{outline:2px solid var(--un);outline-offset:-3px}

  input,select{background:var(--chamber-deep);border:1px solid var(--chamber-line);
    color:var(--placard);font-family:var(--body);font-size:14px;padding:9px 11px;border-radius:2px}
  input:focus,select:focus{outline:2px solid var(--un);outline-offset:-1px}
  input::placeholder{color:#6B7F92}
  .search{width:100%;max-width:320px;margin-bottom:16px}

  .btn{appearance:none;cursor:pointer;background:var(--un);color:var(--chamber-deep);border:0;
    border-radius:2px;font-family:var(--display);font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;font-weight:500;padding:10px 16px;transition:filter .16s}
  .btn:hover{filter:brightness(1.12)}
  .btn.gold{background:var(--gavel)}
  .btn.ghost{background:transparent;border:1px solid var(--chamber-line);color:var(--placard-dim)}
  .btn.ghost:hover{border-color:var(--un);color:var(--placard)}
  .btn:focus-visible{outline:2px solid var(--gavel);outline-offset:2px}

  .empty{border:1px dashed var(--chamber-line);border-radius:3px;padding:28px 22px;
    text-align:center;color:var(--placard-dim);font-size:14px}
  .empty strong{display:block;font-family:var(--display);font-size:16px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--placard);margin-bottom:6px;font-weight:400}

  .highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px;margin-bottom:8px}
  .hl{background:var(--chamber-deep);border:1px solid var(--chamber-line);border-radius:2px;
    padding:13px 14px;position:relative;overflow:hidden}
  .hl .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--un);margin-bottom:5px}
  .hl .val{font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:.03em;
    text-transform:uppercase;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hl .val.none{color:var(--ink-soft);font-weight:300;font-size:16px}
  .hl .fig{font-family:var(--mono);font-size:11px;color:var(--gavel);margin-top:4px;letter-spacing:.05em}
  .hl .emo{position:absolute;right:10px;top:9px;font-size:15px;opacity:.5}

  .promos{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
  .promo{font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:var(--chamber-deep);
    border:1px solid var(--gavel-dim);color:var(--gavel);border-radius:2px;padding:5px 9px}

  .board{display:flex;flex-direction:column;gap:7px}
  .placard{position:relative;display:grid;grid-template-columns:46px 1fr auto;align-items:center;
    gap:12px;background:var(--placard);color:var(--ink);border-radius:2px 2px 3px 3px;
    padding:12px 14px 12px 0;
    box-shadow:0 1px 0 rgba(0,0,0,.35),0 6px 14px -10px rgba(0,0,0,.9)}
  .rank{font-family:var(--mono);font-weight:600;font-size:15px;text-align:center;
    color:var(--ink-soft);border-right:1px solid var(--placard-dim);padding:4px 0;
    align-self:stretch;display:flex;align-items:center;justify-content:center}
  .placard.medal .rank{background:var(--gavel);color:var(--chamber-deep)}
  .placard.medal{box-shadow:0 1px 0 rgba(0,0,0,.35),0 6px 14px -10px rgba(0,0,0,.9),
    inset 3px 0 0 var(--gavel-dim)}
  .placard.sg{box-shadow:0 1px 0 rgba(0,0,0,.35),0 8px 18px -10px rgba(0,0,0,.9),
    0 0 0 1.5px var(--t4),inset 3px 0 0 var(--gavel-dim)}
  .who{min-width:0}
  .name{font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:.05em;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tierbadge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.11em;
    padding:1.5px 6px;border-radius:2px;margin-left:7px;vertical-align:2px;color:#fff;font-weight:600}
  .novice-flag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
    background:var(--ink-soft);color:#fff;padding:1px 5px;border-radius:2px;margin-left:5px;vertical-align:2px}
  .meta{font-size:11px;color:var(--ink-soft);font-family:var(--mono);letter-spacing:.05em;margin-top:2px}
  .pts{font-family:var(--mono);font-weight:600;font-size:20px;color:var(--ink);white-space:nowrap}
  .pts small{font-size:10px;color:var(--ink-soft);font-weight:400;margin-left:3px;letter-spacing:.08em}
  .bar{grid-column:2 / -1;height:4px;background:var(--placard-dim);border-radius:2px;
    overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;border-radius:2px}

  .teamrow{display:grid;grid-template-columns:28px 1fr auto;gap:11px;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(22,57,92,.6)}
  .teamrow .tr{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
  .teamrow .tn{font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase}
  .teamrow .tb{height:3px;background:var(--chamber-line);border-radius:2px;overflow:hidden;margin-top:6px}
  .teamrow .tb i{display:block;height:100%;background:var(--un);border-radius:2px}
  .teamrow .tp{font-family:var(--mono);font-weight:600;font-size:16px;color:var(--gavel)}
  .teamrow .tm{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em;margin-top:1px}

  .bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:8px}
  .exec{background:var(--chamber-deep);border:1px solid var(--chamber-line);
    border-top:3px solid var(--gavel);border-radius:2px;padding:12px 13px}
  .exec .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gavel);margin-bottom:4px}
  .exec .n{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.04em;
    text-transform:uppercase;line-height:1.1}
  .exec.officer{border-top-color:var(--un)}
  .exec.officer .t{color:var(--un)}

  .picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
  .chip{appearance:none;cursor:pointer;background:var(--chamber-deep);
    border:1px solid var(--chamber-line);color:var(--placard-dim);border-radius:2px;
    font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 11px;transition:all .16s}
  .chip:hover{border-color:var(--un);color:var(--placard)}
  .chip[aria-pressed="true"]{background:var(--placard);color:var(--ink);
    border-color:var(--placard);font-weight:500}
  .chip.att[aria-pressed="true"]{background:var(--present);border-color:var(--present);color:#fff}
  .chip .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:6px}
  .chip:focus-visible{outline:2px solid var(--gavel);outline-offset:2px}

  .actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px}
  .act{appearance:none;cursor:pointer;text-align:left;background:var(--chamber-deep);
    border:1px solid var(--chamber-line);border-radius:2px;padding:12px 13px;display:flex;
    justify-content:space-between;align-items:center;gap:10px;color:var(--placard);
    font-family:var(--body);font-size:13.5px;transition:border-color .16s,background .16s}
  .act:hover:not(:disabled){border-color:var(--gavel);background:#0B2A48}
  .act:disabled{opacity:.35;cursor:not-allowed}
  .act .v{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--gavel)}
  .act .cap{display:block;font-size:10.5px;color:var(--ink-soft);font-family:var(--mono);
    letter-spacing:.05em;margin-top:2px}

  .feed{margin-top:26px;border-top:1px solid var(--chamber-line);padding-top:14px}
  .feed-row{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:8px 0;border-bottom:1px solid rgba(22,57,92,.5);font-size:13px}
  .feed-row .d{font-family:var(--mono);color:var(--gavel);font-weight:600;font-size:12.5px}
  .undo{appearance:none;background:none;border:0;cursor:pointer;color:var(--ink-soft);
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 6px}
  .undo:hover{color:var(--warn)}

  .roster-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;
    border-bottom:1px solid var(--chamber-line)}
  .roster-row .rn{font-family:var(--display);font-size:16px;letter-spacing:.05em;
    text-transform:uppercase;flex:1 1 150px;min-width:0}
  .roster-row input[data-team]{width:128px}
  .addbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .addbar input[name=name]{flex:1 1 180px}

  .awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .award{background:var(--chamber-deep);border:1px solid var(--chamber-line);
    border-left:3px solid var(--gavel);border-radius:2px;padding:14px 15px}
  .award.fun{border-left-color:var(--un)}
  .award h3{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--placard-dim);margin:0 0 7px}
  .award .winner{font-family:var(--display);font-weight:500;font-size:21px;letter-spacing:.03em;
    text-transform:uppercase;color:var(--placard);line-height:1.1}
  .award .basis{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
    color:var(--ink-soft);margin-top:6px}
  .award .winner.none{color:var(--ink-soft);font-weight:300}

  table.rules{width:100%;border-collapse:collapse;font-size:13.5px}
  table.rules th{text-align:left;font-family:var(--display);font-weight:400;font-size:11.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--un);padding:0 0 8px;
    border-bottom:1px solid var(--chamber-line)}
  table.rules td{padding:10px 0;border-bottom:1px solid rgba(22,57,92,.55);vertical-align:top}
  table.rules td:last-child{text-align:right;font-family:var(--mono);font-weight:600;
    color:var(--gavel);white-space:nowrap}
  table.rules .note{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  .tierline{display:flex;align-items:center;gap:11px;padding:9px 0;
    border-bottom:1px solid rgba(22,57,92,.55)}
  .tierline .sw{width:5px;height:26px;border-radius:2px;flex:0 0 auto}
  .tierline .tnm{font-family:var(--display);font-size:17px;letter-spacing:.06em;
    text-transform:uppercase;flex:1}
  .tierline .trg{font-family:var(--mono);font-size:12px;color:var(--gavel)}
  .callout{border-left:3px solid var(--un);background:var(--chamber-deep);padding:13px 15px;
    margin:20px 0;font-size:13.5px;color:var(--placard-dim);border-radius:0 2px 2px 0}
  .callout b{color:var(--placard);font-weight:600}
  .callout.gold{border-left-color:var(--gavel)}

  textarea{width:100%;min-height:150px;background:var(--chamber-deep);color:var(--placard);
    border:1px solid var(--chamber-line);border-radius:2px;font-family:var(--mono);
    font-size:11.5px;padding:11px;resize:vertical}

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:var(--placard);color:var(--ink);font-family:var(--display);font-size:14px;
    letter-spacing:.06em;text-transform:uppercase;padding:11px 20px;border-radius:2px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.8);opacity:0;pointer-events:none;
    transition:opacity .22s,transform .22s;z-index:50}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .footer-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;padding-top:18px;
    border-top:1px solid var(--chamber-line)}
  .tally{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft);
    margin:-8px 0 14px}
  footer.credit{text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    color:var(--ink-soft);text-transform:uppercase;padding:34px 16px 0}

  @media (max-width:520px){
    .placard{grid-template-columns:38px 1fr auto;gap:9px;padding-right:11px}
    .name{font-size:16px}.pts{font-size:18px}.actions{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>

<div id="banner"></div>

<div class="chamber-bar">
  <div class="wrap">
    <p class="eyebrow">The King's School · Parramatta</p>
    <h1>Model UN <span class="thin">Term Leaderboard</span></h1>
    <div class="session-strip">
      <span>Current sitting · <b id="sessLabel">—</b></span>
      <span>Delegates · <b id="sessCount">0</b></span>
      <span id="hereWrap">Present today · <b id="sessHere">0</b></span>
      <span>Points awarded · <b id="sessPts">0</b></span>
    </div>
  </div>
</div>

<div class="wrap">
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="panel"><div class="empty"><strong>Loading</strong>Fetching the current standings.</div></main>
  <footer class="credit">TKS Model UN · Updated by the executive</footer>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================================
   TKS MUN LEADERBOARD
   Public visitors see a read-only board built from data.json.
   Add #admin to the URL for the logging console. Admin edits are saved
   only in that browser until "Publish" is used to update data.json.
   ========================================================================= */

const DRAFT_KEY='tks_mun_draft_v1';

const TIERS=[
  {n:'Rookie',            min:0,  max:10,       c:'var(--t0)'},
  {n:'Delegate',          min:11, max:25,       c:'var(--t1)'},
  {n:'Diplomat',          min:26, max:45,       c:'var(--t2)'},
  {n:'Ambassador',        min:46, max:70,       c:'var(--t3)'},
  {n:'Secretary-General', min:71, max:Infinity, c:'var(--t4)'}
];
const tierIdx=p=>{let i=0;TIERS.forEach((t,j)=>{if(p>=t.min)i=j});return i};
const tierOf=p=>TIERS[tierIdx(p)];
function tierProgress(p){
  const i=tierIdx(p), t=TIERS[i];
  if(i===TIERS.length-1) return {pct:100,toNext:0,next:null};
  const span=(t.max+1)-t.min;
  return {pct:Math.round((p-t.min)/span*100),toNext:(t.max+1)-p,next:TIERS[i+1].n};
}

const ACTIONS=[
  {k:'attend',    l:'Attended the sitting',              p:1, cap:1, grp:'core'},
  {k:'speech',    l:'Delivered a speech',                p:2,        grp:'core'},
  {k:'poi',       l:'POI asked (chair-recognised)',      p:1, cap:3, grp:'core'},
  {k:'poiAns',    l:'Answered a POI well',               p:1, cap:3, grp:'core'},
  {k:'amendSub',  l:'Amendment submitted',               p:1,        grp:'paper'},
  {k:'amendPass', l:'Amendment passed',                  p:3,        grp:'paper'},
  {k:'paper',     l:'Working paper / resolution author', p:4,        grp:'paper'},
  {k:'bestDel',   l:'Best Delegate (this sitting)',      p:5, cap:1, grp:'honours'},
  {k:'honourable',l:'Honourable mention',                p:3, cap:1, grp:'honours'},
  {k:'chair',     l:'Chaired the sitting',               p:4, cap:1, grp:'honours'},
  {k:'recruit',   l:'Recruit confirmed (3 sittings)',    p:2,        grp:'club'},
  {k:'external',  l:"Represented King's externally",     p:5,        grp:'club'},
  {k:'extAward',  l:'Award at an external conference',   p:3,        grp:'club'},
  {k:'tksmun',    l:'TksMUN 2027 organising shift',      p:5,        grp:'club'}
];
const AMAP=Object.fromEntries(ACTIONS.map(a=>[a.k,a]));
const ROLES={captain:'Captain',vice:'Vice Captain',officer:'Officer',delegate:'Delegate'};

/* fallback so the page still works if data.json can't be fetched
   (for example when opening the file directly instead of via a server) */
const FALLBACK={seq:100,currentSession:'s1',sessions:[{id:'s1',label:'Sitting 1',chairId:null}],
  events:[],members:[
  ['Austin Xu','captain'],['Jerry Zhang','vice'],['Vasisht Guruprakash','officer'],
  ['Samuel Hong','officer'],['Ethan Zhang','officer'],
  ...['Aaron Song','Agastya Vegunta','Akash Konduru','Akshat Sahdev','Ali Sarangpurwala',
  'Avinash Shekhar','Carston Kwan','Charlie Shannon','Daniel Baird-Gunning','Edward Zhang',
  'Ethan Tsui','Eugene Chen','Felson Ji','Franklin Du','Hugo Hughes','Jack Horwood','Jack Wang',
  'Jacob Ball','Jacob Davies','Jacob Yao','Jayden Zhao','Jeffrey Shi','Jeremy Le','Jones Burley',
  'Juwon Park','Kai Ding','Keethan Jeyarajah','Levi Zeng','Lucas Liu','Matheen Deen','Maximus Lee',
  'Maxwell Zhu','Panayiotis Hatzistamatiou','Raaghav Gore','Rayn Javed','Reyaansh Kumar',
  'Sam Harvey','Sam Tehrani','Tedon Yin','Vikrant Madan','Vincent del Villar','Wesley Wong']
  .map(n=>[n,'delegate'])].map((x,i)=>({id:'m'+(i+1),name:x[0],year:'',division:'open',role:x[1],team:''}))};

let S=null, PUBLISHED=null;
let ADMIN=location.hash.toLowerCase().includes('admin');
let hasDraft=false;
let tab='board', division='open', selected=null, mode='attend', q='', qr='';

/* ---------- loading ---------- */
async function boot(){
  try{
    const r=await fetch('data.json',{cache:'no-store'});
    PUBLISHED=await r.json();
  }catch(e){
    PUBLISHED=JSON.parse(JSON.stringify(FALLBACK));
  }
  PUBLISHED.members.forEach(m=>{if(m.team===undefined)m.team=''});

  if(ADMIN){
    const d=localStorage.getItem(DRAFT_KEY);
    if(d){ try{ S=JSON.parse(d); hasDraft=true; }catch(e){ S=clone(PUBLISHED) } }
    else S=clone(PUBLISHED);
  }else{
    S=PUBLISHED;
  }
  buildTabs(); render();
}
const clone=o=>JSON.parse(JSON.stringify(o));
function saveDraft(){
  if(!ADMIN) return;
  hasDraft=true;
  try{ localStorage.setItem(DRAFT_KEY,JSON.stringify(S)); }catch(e){}
}

/* ---------- data ---------- */
const byId=id=>S.members.find(m=>m.id===id);
const isExec=m=>m.role!=='delegate';
const delegates=()=>S.members.filter(m=>!isExec(m));
const execs=()=>S.members.filter(isExec)
  .sort((a,b)=>['captain','vice','officer'].indexOf(a.role)-['captain','vice','officer'].indexOf(b.role));
const curSession=()=>S.sessions.find(s=>s.id===S.currentSession);
const uid=p=>p+(S.seq++);

function total(id){return S.events.filter(e=>e.memberId===id).reduce((a,e)=>a+e.points,0)}
function totalIn(id,k){return S.events.filter(e=>e.memberId===id&&k.includes(e.action)).reduce((a,e)=>a+e.points,0)}
function countIn(id,k){return S.events.filter(e=>e.memberId===id&&k.includes(e.action)).length}
function sessCount(id,a){return S.events.filter(e=>e.memberId===id&&e.action===a&&e.sessionId===S.currentSession).length}
function sessPoints(id,keys){return S.events.filter(e=>e.memberId===id&&e.sessionId===S.currentSession&&(!keys||keys.includes(e.action))).reduce((a,e)=>a+e.points,0)}
function pointsBeforeCurrent(id){return S.events.filter(e=>e.memberId===id&&e.sessionId!==S.currentSession).reduce((a,e)=>a+e.points,0)}
const isPresent=id=>sessCount(id,'attend')>0;

function ranked(div){
  return delegates().filter(m=>div==='all'||m.division===div)
    .map(m=>({...m,pts:total(m.id)})).sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name));
}
function teams(){
  const map={};
  delegates().forEach(m=>{const t=(m.team||'').trim(); if(!t)return;
    if(!map[t])map[t]={name:t,pts:0,n:0}; map[t].pts+=total(m.id); map[t].n++});
  return Object.values(map).sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name));
}
function biggestMover(){let b=null;delegates().forEach(m=>{const v=sessPoints(m.id);if(v>0&&(!b||v>b.v))b={m,v}});return b}
function speakerOfWeek(){let b=null;delegates().forEach(m=>{const v=sessPoints(m.id,['speech']);if(v>0&&(!b||v>b.v))b={m,v}});return b}
function promotions(){
  return delegates().map(m=>{
    const before=pointsBeforeCurrent(m.id), now=total(m.id);
    return tierIdx(now)>tierIdx(before)&&sessPoints(m.id)>0?{name:m.name,tier:tierOf(now).n}:null;
  }).filter(Boolean);
}
function improved(){
  const ss=S.sessions.map(s=>s.id); if(ss.length<4)return null;
  const mid=Math.floor(ss.length/2), f=ss.slice(0,mid), s2=ss.slice(mid);
  let best=null;
  delegates().forEach(m=>{
    const a=S.events.filter(e=>e.memberId===m.id&&f.includes(e.sessionId)).reduce((x,e)=>x+e.points,0);
    const b=S.events.filter(e=>e.memberId===m.id&&s2.includes(e.sessionId)).reduce((x,e)=>x+e.points,0);
    if(b-a>0&&(!best||b-a>best.d))best={m,d:b-a};
  });
  return best;
}
function topBy(fn,div){let b=null;delegates().filter(m=>!div||m.division===div)
  .forEach(m=>{const v=fn(m.id);if(v>0&&(!b||v>b.v))b={m,v}});return b}

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;
function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600);
}
const match=(n,t)=>n.toLowerCase().includes(t.toLowerCase());

function banner(){
  const b=document.getElementById('banner');
  if(!ADMIN){b.innerHTML='';return}
  b.innerHTML=`<div class="adminbar">Admin console — changes are saved on this device only</div>`+
    (hasDraft?`<div class="draftbar">Unpublished changes · publish from the Publish tab to update the live site</div>`:'');
}
function strip(){
  const s=curSession();
  document.getElementById('sessLabel').textContent=s?s.label:'—';
  document.getElementById('sessCount').textContent=delegates().length;
  document.getElementById('sessHere').textContent=delegates().filter(m=>isPresent(m.id)).length;
  document.getElementById('sessPts').textContent=S.events.reduce((a,e)=>a+e.points,0);
}
function buildTabs(){
  const pub=[['board','Standings'],['awards','Term awards'],['rules','Scoring']];
  const adm=[['board','Standings'],['log','Log points'],['roster','Roster'],
             ['awards','Term awards'],['rules','Scoring'],['publish','Publish']];
  document.getElementById('tabs').innerHTML=(ADMIN?adm:pub)
    .map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}">${l}</button>`).join('');
}

/* ---------- render ---------- */
function render(){
  banner(); strip();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  const views={board:vBoard,awards:vAwards,rules:vRules,log:vLog,roster:vRoster,publish:vPublish};
  if(!ADMIN&&['log','roster','publish'].includes(tab)) tab='board';
  document.getElementById('panel').innerHTML=views[tab]();
  wire();
}

    <div class="t">${ROLES[m.role]}</div><div class="n">${esc(m.name)}</div></div>`).join('');

  return `<h2 class="sec">This sitting</h2>${hl}${promoHtml}

function vLog(){
  const opts=S.sessions.map(s=>`<option value="${s.id}" ${s.id===S.currentSession?'selected':''}>${esc(s.label)}</option>`).join('');
  const chairOpts=`<option value="">Chair — not set</option>`+
    execs().map(m=>`<option value="${m.id}" ${curSession()&&curSession().chairId===m.id?'selected':''}>${esc(m.name)}</option>`).join('');

/* ---------- admin actions ---------- */
function award(id,key){
  const a=AMAP[key];
  if(a.cap&&sessCount(id,key)>=a.cap){toast('Cap reached this sitting');return}
  const before=tierIdx(total(id));
  S.events.push({id:uid('e'),sessionId:S.currentSession,memberId:id,action:key,points:a.p,ts:Date.now()});
  saveDraft();
  const after=tierIdx(total(id));
  toast(after>before?byId(id).name.split(' ')[0]+' → '+TIERS[after].n:byId(id).name.split(' ')[0]+' +'+a.p);
  render();
}
function toggleAttend(id){
  const ev=S.events.find(e=>e.memberId===id&&e.action==='attend'&&e.sessionId===S.currentSession);
  if(ev) S.events=S.events.filter(e=>e.id!==ev.id);
  else S.events.push({id:uid('e'),sessionId:S.currentSession,memberId:id,action:'attend',points:1,ts:Date.now()});
  saveDraft(); render();
}
function weeklyPost(){
  const s=curSession(), mv=biggestMover(), sp=speakerOfWeek(), tm=teams(), promo=promotions();
  let out='TKS MODEL UN — '+(s?s.label.toUpperCase():'THIS SITTING')+'\n\n';
  out+='🔥 Biggest mover: '+(mv?`${mv.m.name} +${mv.v}`:'—')+'\n';
  out+='🎤 Speaker of the Week: '+(sp?sp.m.name:'—')+'\n';
  out+='🌍 Leading team: '+(tm.length?`${tm[0].name} — ${tm[0].pts}`:'—')+'\n';
  if(promo.length) out+='\nPROMOTIONS\n'+promo.map(p=>`▲ ${p.name} → ${p.tier}`).join('\n')+'\n';
  out+='\nTOP 5\n'+ranked('open').slice(0,5).map((m,i)=>`${i+1}. ${m.name} — ${m.pts} pts (${tierOf(m.pts).n})`).join('\n');
  return out;
}

function wire(){
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

  $$('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;q='';qr='';render()});
  $$('#divSeg button').forEach(b=>b.onclick=()=>{division=b.dataset.div;render()});

  const cw=$('#copyWeek');  if(cw) cw.onclick=()=>copy(weeklyPost());
  const cb=$('#copyBoard'); if(cb) cb.onclick=()=>copy('TKS MODEL UN — TERM STANDINGS\n\n'+
    ranked(division).slice(0,10).map((m,i)=>`${i+1}. ${m.name} — ${m.pts} pts (${tierOf(m.pts).n})`).join('\n'));
  const ca=$('#copyAwards');if(ca) ca.onclick=()=>copy('TKS MODEL UN — TERM AWARDS\n\n'+
    $$('.award').map(a=>`${a.querySelector('h3').textContent}: ${a.querySelector('.winner').textContent}`).join('\n'));

  if(!ADMIN) return;

  $$('#modeSeg button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;selected=null;render()});
  const keepFocus=id=>{const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
  const qi=$('#q');   if(qi)  qi.oninput=()=>{q=qi.value;render();keepFocus('q')};
  const qri=$('#qr'); if(qri) qri.oninput=()=>{qr=qri.value;render();keepFocus('qr')};

  $$('[data-att]').forEach(b=>b.onclick=()=>toggleAttend(b.dataset.att));
  $$('[data-sel]').forEach(b=>b.onclick=()=>{selected=selected===b.dataset.sel?null:b.dataset.sel;render()});
  $$('[data-act]').forEach(b=>b.onclick=()=>award(selected,b.dataset.act));
  $$('[data-undo]').forEach(b=>b.onclick=()=>{S.events=S.events.filter(e=>e.id!==b.dataset.undo);saveDraft();toast('Removed');render()});

  const ai=$('#allIn'); if(ai) ai.onclick=()=>{
    delegates().forEach(m=>{if(!isPresent(m.id))
      S.events.push({id:uid('e'),sessionId:S.currentSession,memberId:m.id,action:'attend',points:1,ts:Date.now()})});
    saveDraft(); toast('Full house'); render()};
  const ao=$('#allOut'); if(ao) ao.onclick=()=>{
    if(!confirm('Clear attendance for this sitting?'))return;
    S.events=S.events.filter(e=>!(e.action==='attend'&&e.sessionId===S.currentSession));
    saveDraft(); toast('Attendance cleared'); render()};

  const ss=$('#sessSel'); if(ss) ss.onchange=()=>{S.currentSession=ss.value;saveDraft();render()};
  const cs=$('#chairSel');if(cs) cs.onchange=()=>{curSession().chairId=cs.value||null;saveDraft();toast('Chair set')};
  const ns=$('#newSess'); if(ns) ns.onclick=()=>{
    const s={id:uid('s'),label:'Sitting '+(S.sessions.length+1),chairId:null};
    S.sessions.push(s); S.currentSession=s.id; selected=null; saveDraft(); toast(s.label+' open'); render()};

  const am=$('#addMember'); if(am) am.onclick=()=>{
    const n=$('#newName').value.trim(); if(!n){toast('Name required');return}
    S.members.push({id:uid('m'),name:n,year:$('#newYear').value,division:$('#newDiv').value,
      role:'delegate',team:$('#newTeam').value.trim()});
    saveDraft(); toast(n+' added'); render()};
  const nn=$('#newName'); if(nn) nn.onkeydown=e=>{if(e.key==='Enter')document.getElementById('addMember').click()};

  $$('[data-team]').forEach(i=>i.onchange=()=>{byId(i.dataset.team).team=i.value.trim();saveDraft();toast('Team set')});
  $$('[data-year]').forEach(s=>s.onchange=()=>{byId(s.dataset.year).year=s.value;saveDraft()});
  $$('[data-divsel]').forEach(s=>s.onchange=()=>{byId(s.dataset.divsel).division=s.value;saveDraft();render()});
  $$('[data-role]').forEach(s=>s.onchange=()=>{byId(s.dataset.role).role=s.value;saveDraft();render()});
  $$('[data-del]').forEach(b=>b.onclick=()=>{
    const m=byId(b.dataset.del);
    if(!confirm('Remove '+m.name+' and all their points?'))return;
    S.members=S.members.filter(x=>x.id!==b.dataset.del);
    S.events=S.events.filter(e=>e.memberId!==b.dataset.del);
    if(selected===b.dataset.del) selected=null;
    saveDraft(); toast('Removed'); render()});

  const cj=$('#copyJson'); if(cj) cj.onclick=()=>copy(JSON.stringify(S,null,2));
  const dj=$('#dlJson');   if(dj) dj.onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='data.json'; a.click();
    URL.revokeObjectURL(a.href); toast('Downloaded')};
  const dc=$('#discard');  if(dc) dc.onclick=()=>{
    if(!confirm('Discard everything logged since the last publish?'))return;
    localStorage.removeItem(DRAFT_KEY); S=clone(PUBLISHED); hasDraft=false;
    toast('Back to published'); render()};
}

function copy(t){
  navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>{
    const ta=document.getElementById('jsonOut');
    if(ta){ta.select();document.execCommand('copy');toast('Copied')}else toast('Copy failed')});
}

window.addEventListener('hashchange',()=>location.reload());
boot();
</script>
</body>
</html>
